<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>
    <!-- Mobile Sidebar Backdrop Overlay -->
    <div class="dash-sidebar-overlay" id="sidebarOverlay"></div>

    <div class="dashboard-wrapper">
        <!-- ================================================================
             SIDEBAR (10 Separate Dynamic Subview Buttons per Active Role)
             ================================================================ -->
        <aside class="dash-sidebar" id="dashSidebar">
            <div class="dash-sidebar-header">
                <a href="javascript:void(0);" class="dash-sidebar-logo" id="dashSidebarLogo" title="Overview">
                    <img src="images/logo-stackly.png" alt="Stackly" style="max-height: 36px; width: auto; filter: brightness(0) invert(1);">
                </a>
                <button type="button" class="dash-sidebar-close" id="sidebarCloseBtn" aria-label="Close Sidebar">
                    <i class="fas fa-times"></i>
                </button>
            </div>

            <!-- Role Badge in Sidebar -->
            <div class="dash-role-badge-box">
                <span class="dash-role-pill role-pill-user" id="sidebarRolePill">
                    <i class="fas fa-user-circle" id="sidebarRoleIcon"></i>
                    <span id="sidebarRoleText">Standard User</span>
                </span>
            </div>

            <!-- 10 Sidebar Items Navigation (Each loads its own separate section inside dashboard.html) -->
            <ul class="dash-sidebar-menu" id="sidebarMenuList">
                <!-- Dynamically generated with 10 role-specific item buttons -->
            </ul>

            <!-- Sidebar User Profile & Logout -->
            <div class="dash-sidebar-footer">
                <div class="dash-user-profile">
                    <div class="dash-user-avatar" id="sidebarUserAvatar">U</div>
                    <div class="dash-user-info">
                        <span class="dash-user-name" id="sidebarUserName">User</span>
                        <span class="dash-user-email" id="sidebarUserEmail">user@example.com</span>
                    </div>
                </div>
                <button type="button" class="dash-logout-btn" id="sidebarLogoutBtn" title="Log Out">
                    <i class="fas fa-sign-out-alt"></i>
                </button>
            </div>
        </aside>

        <!-- ================================================================
             MAIN CONTENT AREA (Dynamically renders each separate page view)
             ================================================================ -->
        <main class="dash-main">
            <!-- Topbar Header -->
            <header class="dash-topbar">
                <div class="dash-topbar-left">
                    <button type="button" class="dash-mobile-toggler" id="sidebarOpenBtn" aria-label="Toggle Navigation">
                        <i class="fas fa-bars"></i>
                    </button>
                    <div class="dash-greeting">
                        <h3 id="topbarGreetingTitle">Welcome Back</h3>
                        <p id="topbarGreetingSub">Select any module from the sidebar to view its dedicated section.</p>
                    </div>
                </div>

            </header>

            <!-- Dynamic Subview Container (Contains the 10 separate pages inside dashboard.html) -->
            <div class="dash-content" id="dashContentArea">
                <!-- Content injected dynamically based on active role and clicked sidebar item -->
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="js/auth.js?v=2.4"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            // Get active user from auth storage
            let user = StacklyAuth.getCurrentUser();
            if (!user) {
                window.location.href = 'login.html';
                return;
            }

            // Check if role is forced via URL parameter
            const urlParams = new URLSearchParams(window.location.search);
            const roleQuery = urlParams.get('role');
            if (roleQuery && ['admin', 'manager', 'user'].includes(roleQuery.toLowerCase())) {
                user.role = roleQuery.toLowerCase();
                StacklyAuth.setCurrentUser(user);
            }

            let currentRole = user.role;
            let currentViewIndex = 0; // Starts at item 0

            // DOM References
            const dashSidebar = document.getElementById('dashSidebar');
            const sidebarOverlay = document.getElementById('sidebarOverlay');
            const sidebarOpenBtn = document.getElementById('sidebarOpenBtn');
            const sidebarCloseBtn = document.getElementById('sidebarCloseBtn');

            const sidebarRolePill = document.getElementById('sidebarRolePill');
            const sidebarRoleIcon = document.getElementById('sidebarRoleIcon');
            const sidebarRoleText = document.getElementById('sidebarRoleText');
            const sidebarMenuList = document.getElementById('sidebarMenuList');

            const sidebarUserAvatar = document.getElementById('sidebarUserAvatar');
            const sidebarUserName = document.getElementById('sidebarUserName');
            const sidebarUserEmail = document.getElementById('sidebarUserEmail');
            const sidebarLogoutBtn = document.getElementById('sidebarLogoutBtn');

            const topbarGreetingTitle = document.getElementById('topbarGreetingTitle');
            const topbarGreetingSub = document.getElementById('topbarGreetingSub');
            const dashContentArea = document.getElementById('dashContentArea');

            // Mobile Sidebar Drawer Handlers
            function openSidebar() {
                dashSidebar.classList.add('active');
                sidebarOverlay.classList.add('active');
                document.body.style.overflow = 'hidden';
            }

            function closeSidebar() {
                dashSidebar.classList.remove('active');
                sidebarOverlay.classList.remove('active');
                document.body.style.overflow = '';
            }

            sidebarOpenBtn.addEventListener('click', openSidebar);
            sidebarCloseBtn.addEventListener('click', closeSidebar);
            sidebarOverlay.addEventListener('click', closeSidebar);

            // Auto-close mobile sidebar and remove overlay when resizing back to desktop view (>= 992px)
            function handleDashboardResize() {
                if (window.innerWidth >= 992) {
                    closeSidebar();
                }
            }
            window.addEventListener('resize', handleDashboardResize, { passive: true });
            handleDashboardResize();

            // Close on Escape key
            document.addEventListener('keydown', function (e) {
                if (e.key === 'Escape') {
                    closeSidebar();
                }
            });

            // Logout Handler
            sidebarLogoutBtn.addEventListener('click', function () {
                StacklyAuth.logoutUser(true);
            });

            // Activate and display a specific sidebar view by index
            function activateSidebarView(index) {
                currentViewIndex = index;
                const items = document.querySelectorAll('.dash-sidebar-item');
                items.forEach((el, idx) => {
                    if (idx === index) {
                        el.classList.add('active');
                    } else {
                        el.classList.remove('active');
                    }
                });

                // Render the selected view
                renderPageView(currentRole, index);

                // If on mobile, close drawer automatically
                if (window.innerWidth < 992) {
                    closeSidebar();
                }
            }

            // Dashboard Logo Handler: Clicking logo navigates to first sidebar item instead of index.html
            const dashSidebarLogo = document.getElementById('dashSidebarLogo');
            if (dashSidebarLogo) {
                dashSidebarLogo.addEventListener('click', function (e) {
                    e.preventDefault();
                    activateSidebarView(0);
                });
            }

            function switchRole(roleId) {
                currentRole = roleId;
                user.role = roleId;
                currentViewIndex = 0;
                StacklyAuth.setCurrentUser(user);

                renderSidebarMenu(roleId);
                renderPageView(roleId, currentViewIndex);
            }

            // Format user display name cleanly
            function getFormattedUserName(userObj) {
                if (!userObj) return 'User';
                let raw = userObj.name || (userObj.email ? userObj.email.split('@')[0] : 'User');
                const cleaned = raw.replace(/[._-]+/g, ' ').trim();
                return cleaned.split(' ').map(w => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase()).join(' ') || 'User';
            }

            // Render 10 Sidebar Items
            function renderSidebarMenu(roleKey) {
                const config = StacklyAuth.ROLE_CONFIGS[roleKey] || StacklyAuth.ROLE_CONFIGS.user;
                const displayName = getFormattedUserName(user);

                // Update User details in sidebar
                sidebarUserName.textContent = displayName;
                sidebarUserEmail.textContent = user.email || `${roleKey}@stackly.com`;
                sidebarUserAvatar.textContent = displayName.charAt(0).toUpperCase();

                // Update Sidebar Badge
                sidebarRolePill.className = `dash-role-pill ${config.badgeClass}`;
                sidebarRoleIcon.className = config.icon;
                sidebarRoleText.textContent = config.title;

                sidebarMenuList.innerHTML = '';
                config.sidebar.forEach((item, index) => {
                    const li = document.createElement('li');
                    li.className = `dash-sidebar-item ${index === currentViewIndex ? 'active' : ''}`;
                    li.dataset.index = index;

                    const badgeHtml = item.badge ? `<span class="dash-item-badge">${item.badge}</span>` : '';

                    li.innerHTML = `
                        <button type="button" class="dash-sidebar-link">
                            <div class="dash-sidebar-link-content">
                                <i class="${item.icon}"></i>
                                <span>${item.title}</span>
                            </div>
                            ${badgeHtml}
                        </button>
                    `;

                    // When clicked: Swaps the subview page directly inside dashboard.html!
                    li.addEventListener('click', function (e) {
                        e.preventDefault();
                        activateSidebarView(index);
                    });

                    sidebarMenuList.appendChild(li);
                });
            }

            // ================================================================
            // VIEW GENERATOR: 10 FULL, COMPREHENSIVE PAGES FOR EACH ROLE
            // ================================================================
            function renderPageView(roleKey, index) {
                const config = StacklyAuth.ROLE_CONFIGS[roleKey] || StacklyAuth.ROLE_CONFIGS.user;
                const currentItem = config.sidebar[index] || config.sidebar[0];
                const displayName = getFormattedUserName(user);

                // Welcome Back, [Name] in Topbar Header
                topbarGreetingTitle.textContent = `Welcome Back, ${displayName}`;
                topbarGreetingSub.textContent = `${config.title} • ${currentItem.title}`;

                let htmlContent = '';

                if (roleKey === 'admin') {
                    htmlContent = getAdminViewHtml(index, currentItem);
                } else if (roleKey === 'manager') {
                    htmlContent = getManagerViewHtml(index, currentItem);
                } else {
                    htmlContent = getUserViewHtml(index, currentItem);
                }

                dashContentArea.innerHTML = htmlContent;
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }

                    case 1: // User & Role Management
                        return `

                                <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px;">
                                    <div><h2>User & Role Management</h2><p>Administer user profiles, grant privileges, enforce 2FA, and configure access hierarchies.</p></div>
