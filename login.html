<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login || Stackly Portal</title>
    <!-- Favicon removed -->
    <link rel="icon" href="data:,">
<!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Prata&display=swap" rel="stylesheet">
    <!-- Bundled CSS -->
    <link rel="stylesheet" href="css/style.css">
    <!-- Custom Auth & Dashboard CSS -->
    <link rel="stylesheet" href="css/custom-auth-dashboard.css?v=2.6">
</head>

<body class="auth-page-body">

    <div class="auth-card">
        <div class="auth-header">
            <a href="index.html" class="auth-logo">
                <img src="images/logo-stackly.webp" alt="Stackly" style="max-height: 46px; width: auto;">
            </a>
            <h2>Welcome Back</h2>
            <p>Select your portal role and sign in with your credentials.</p>
        </div>

        <!-- Registration Success Notification Banner -->
        <div class="auth-success-banner" id="regSuccessBanner" style="display: none; background: #ecfdf5; border: 1px solid #10b981; color: #065f46; padding: 12px 16px; border-radius: 10px; margin-bottom: 20px; font-size: 13.5px; font-weight: 500; align-items: center; gap: 10px;">
            <i class="fas fa-check-circle" style="color: #10b981; font-size: 18px;"></i>
            <span>Registration Successful! Please sign in with your credentials.</span>
        </div>

        <form id="loginForm" novalidate>
            <!-- 3 Roles Selection -->
            <label class="role-selector-title">
                <i class="fas fa-id-badge"></i> Select Your Role:
            </label>
            <div class="role-selector-grid">
                <!-- Role 1: Admin -->
                <input type="radio" name="portalRole" id="roleAdmin" value="admin" class="role-card-radio">
                <label for="roleAdmin" class="role-card-label">
                    <i class="fas fa-shield-alt role-icon"></i>
                    <span class="role-name">Super Admin</span>
                    <span class="role-desc">Full System</span>
                </label>

                <!-- Role 2: Manager -->
                <input type="radio" name="portalRole" id="roleManager" value="manager" class="role-card-radio">
                <label for="roleManager" class="role-card-label">
                    <i class="fas fa-user-tie role-icon"></i>
                    <span class="role-name">Manager</span>
                    <span class="role-desc">Operations</span>
                </label>

                <!-- Role 3: User -->
                <input type="radio" name="portalRole" id="roleUser" value="user" class="role-card-radio" checked>
                <label for="roleUser" class="role-card-label">
                    <i class="fas fa-user-circle role-icon"></i>
                    <span class="role-name">Client User</span>
                    <span class="role-desc">Personal</span>
                </label>
            </div>

            <!-- Email Input -->
            <div class="auth-form-group">
                <label class="auth-label" for="loginEmail">Email Address</label>
                <div class="auth-input-wrapper">
                    <i class="fas fa-envelope auth-input-icon"></i>
                    <input type="email" id="loginEmail" class="auth-input" placeholder="e.g. user@example.com" required autocomplete="email">
                </div>
                <div class="auth-error-msg" id="emailErrorMsg">
                    <i class="fas fa-exclamation-circle"></i> Please enter a valid email address (e.g. name@domain.com).
                </div>
            </div>

            <!-- Password Input -->
            <div class="auth-form-group">
                <label class="auth-label" for="loginPassword">Password</label>
                <div class="auth-input-wrapper">
                    <i class="fas fa-lock auth-input-icon"></i>
                    <input type="password" id="loginPassword" class="auth-input" placeholder="Enter your secure password" required autocomplete="current-password">
                    <button type="button" class="auth-password-toggle" id="pwdToggleBtn" aria-label="Toggle password visibility">
                        <i class="fas fa-eye" id="pwdToggleIcon"></i>
                    </button>
                </div>
                <div class="auth-error-msg" id="passwordErrorMsg">
                    <i class="fas fa-exclamation-circle"></i> Please enter your password.
                </div>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="auth-submit-btn" id="loginSubmitBtn">
                <span>Sign In to Dashboard</span>
                <i class="fas fa-arrow-right"></i>
            </button>
        </form>

        <div class="auth-footer-links">
            <p>Don't have an account yet? <a href="register.html">Register Here</a></p>
            <div>
                <a href="index.html" class="auth-home-link">
                    <i class="fas fa-home"></i> Return to Home
                </a>
            </div>
        </div>
    </div>

    <!-- Auth Scripts -->
    <script src="js/auth.js?v=2.4"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const emailInput = document.getElementById('loginEmail');
            const passwordInput = document.getElementById('loginPassword');
            const pwdToggleBtn = document.getElementById('pwdToggleBtn');
            const pwdToggleIcon = document.getElementById('pwdToggleIcon');
            const loginForm = document.getElementById('loginForm');
            const emailErrorMsg = document.getElementById('emailErrorMsg');
            const passwordErrorMsg = document.getElementById('passwordErrorMsg');

            // Toggle Password Visibility
            pwdToggleBtn.addEventListener('click', function () {
                const isPassword = passwordInput.type === 'password';
                passwordInput.type = isPassword ? 'text' : 'password';
                pwdToggleIcon.className = isPassword ? 'fas fa-eye-slash' : 'fas fa-eye';
            });

            // Password Validation feedback
            function evaluatePassword() {
                const val = passwordInput.value;
                const isValid = val.trim().length > 0;

                if (isValid) {
                    passwordInput.classList.remove('is-invalid');
                    passwordInput.classList.add('is-valid');
                    passwordErrorMsg.style.display = 'none';
                } else {
                    passwordInput.classList.remove('is-valid');
                }

                return isValid;
            }

            passwordInput.addEventListener('input', function () {
                if (passwordInput.value.length > 0) {
                    passwordInput.classList.remove('is-invalid');
                    passwordErrorMsg.style.display = 'none';
                }
            });

            // Live Email Validation feedback
            emailInput.addEventListener('input', function () {
                const val = emailInput.value.trim();
                if (val.length > 0) {
                    if (StacklyAuth.validateEmail(val)) {
                        emailInput.classList.remove('is-invalid');
                        emailInput.classList.add('is-valid');
                        emailErrorMsg.style.display = 'none';
                    } else {
                        emailInput.classList.remove('is-valid');
                    }
                } else {
                    emailInput.classList.remove('is-valid', 'is-invalid');
                    emailErrorMsg.style.display = 'none';
                }
            });

            // Pre-select role if passed in query param
            const urlParams = new URLSearchParams(window.location.search);
            const roleParam = urlParams.get('role');
            if (roleParam && ['admin', 'manager', 'user'].includes(roleParam.toLowerCase())) {
                const targetRadio = document.getElementById('role' + roleParam.charAt(0).toUpperCase() + roleParam.slice(1).toLowerCase());
                if (targetRadio) targetRadio.checked = true;
            }

            // Check if redirected after successful registration
            const isRegistered = urlParams.get('registered') === 'true';
            const emailParam = urlParams.get('email');
            if (emailParam) {
                emailInput.value = emailParam;
            }
            if (isRegistered) {
                const regSuccessBanner = document.getElementById('regSuccessBanner');
                if (regSuccessBanner) {
                    regSuccessBanner.style.display = 'flex';
                }
                passwordInput.focus();
            }

            // Form Submit: Validate & redirect to dashboard for the selected role
            loginForm.addEventListener('submit', function (e) {
                e.preventDefault();

                const email = emailInput.value.trim();
                const password = passwordInput.value;
                const isEmailValid = StacklyAuth.validateEmail(email);
                const isPasswordValid = evaluatePassword();

                let hasError = false;

                if (!isEmailValid) {
                    emailInput.classList.add('is-invalid');
                    emailErrorMsg.style.display = 'flex';
                    hasError = true;
                } else {
                    emailInput.classList.remove('is-invalid');
                    emailErrorMsg.style.display = 'none';
                }

                if (!isPasswordValid) {
                    passwordInput.classList.add('is-invalid');
                    passwordErrorMsg.style.display = 'flex';
                    hasError = true;
                } else {
                    passwordInput.classList.remove('is-invalid');
                    passwordErrorMsg.style.display = 'none';
                }

                if (hasError) {
                    return;
                }

                // Any email and password meeting the validation criteria will log in successfully!
                const selectedRoleEl = document.querySelector('input[name="portalRole"]:checked');
                const selectedRole = selectedRoleEl ? selectedRoleEl.value : 'user';

                StacklyAuth.setCurrentUser({
                    email: email,
                    role: selectedRole,
                    name: email.split('@')[0]
                });

                // Navigate directly to the selected role dashboard
                window.location.href = 'dashboard.html';
            });
        });
    </script>
</body>
</html>
